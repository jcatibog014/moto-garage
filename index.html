<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moto Garage</title>
  <meta name="description" content="Track motorcycles and cars bought and sold: purchase cost, expenses, sale price and profit.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237c3aed'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='%23ffffff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=12">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-logo" id="brand-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 22V10l8 7 8-7v12"/></svg></span>
        <span class="brand-name" id="brand-name">Moto Garage</span>
      </a>
      <nav class="tabs" aria-label="Main">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/units" data-nav="units">Units</a>
        <a href="#/cash" data-nav="cash">Cash</a>
        <a href="#/reports" data-nav="reports">Reports</a>
      </nav>
      <a class="avatar-link" href="#/profile" data-nav="profile" aria-label="Profile">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="avatar-name" id="avatar-name"></span>
      </a>
      <button class="btn-ghost logout" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <!-- Phone navigation: shown under 768px instead of the top tabs. -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main" hidden>
    <a href="#/" data-nav="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#/units" data-nav="units">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
      <span>Units</span>
    </a>
    <a href="#/units/new" data-nav="new" class="bn-add">
      <span class="bn-plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Add</span>
    </a>
    <a href="#/cash" data-nav="cash">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>
      <span>Cash</span>
    </a>
    <a href="#/reports" data-nav="reports">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Reports</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
</body>
</html>
